{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="Sahypalar">
  {% if page_obj.has_previous %}
    <a href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Yza</a>
  {% endif %}
  <span class="pager__now">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Indiki</a>
  {% endif %}
</nav>
{% endif %}
