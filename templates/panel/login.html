{% extends "panel/base.html" %}
{% block title %}Giriş{% endblock %}
{% block content %}
<section class="box box--narrow">
  <h1>Giriş</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {% if form.errors %}
      <p class="error">Ulanyjy ady ýa-da parol nädogry.</p>
    {% endif %}
    <label for="id_username">Ulanyjy ady</label>
    {{ form.username }}
    <label for="id_password">Parol</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn--primary">Giriş</button>
  </form>
</section>
{% endblock %}
